<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemka Dawa-galinta Bukaanka & Camera Capture</title>
    <!-- Tailwind CSS CDN si uu design-ka u noqdo mid casri ah -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-hospital-user"></i> Diwaan-galinta Bukaanka Cusub
                </h1>
                <p class="text-blue-100 text-sm mt-1">Buuxi foomka oo ka qaad sawir bukaanka toos ah.</p>
            </div>
            <span class="bg-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-400">Live Camera Ready</span>
        </div>

        <form id="patientForm" class="p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- QAYBTA CAMERA-DA & SAWIRKA (LEFT COLUMN) -->
            <div class="lg:col-span-5 flex flex-col items-center border-b lg:border-b-0 lg:border-r border-gray-200 pb-6 lg:pb-0 lg:pr-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-camera text-blue-600"></i> Sawirka Bukaanka
                </h2>

                <!-- Live Camera Stream Box -->
                <div class="relative w-full max-w-[320px] h-[240px] bg-black rounded-xl overflow-hidden shadow-inner border-2 border-gray-300">
                    <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                    <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                        <span class="w-2 h-2 bg-white rounded-full animate-ping"></span> LIVE
                    </span>
                </div>

                <!-- Camera Controls Buttons -->
                <div class="flex gap-2 mt-4 w-full max-w-[320px]">
                    <button type="button" id="switchCamBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-3 rounded-lg text-xs font-medium border transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate"></i> Badal Cam-da
                    </button>
                    <button type="button" id="captureBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-solid fa-camera-retro"></i> Qaad Sawir
                    </button>
                </div>

                <!-- Captured Image Preview Canvas -->
                <div class="mt-6 w-full max-w-[320px]">
                    <label class="block text-xs font-medium text-gray-500 mb-2">Sawirka La Qaaday (Captured Image):</label>
                    <div class="w-full h-[180px] bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden relative">
                        <canvas id="canvas" class="hidden w-full h-full object-cover"></canvas>
                        <p id="placeholderText" class="text-gray-400 text-xs text-center px-4">
                            Saafeeyo ama guji "Qaad Sawir" si uu halkan ugu muuqdo.
                        </p>
                    </div>
                </div>
            </div>

            <!-- QAYBTA FOOMAMKA IYO XOGTA (RIGHT COLUMN) -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                
                <!-- Section 1: Basic Patient Details -->
                <div>
                    <h3 class="text-md font-semibold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user text-blue-500"></i> Xogta Shaqsiga ah
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Magaca Dhamaystiran</label>
                            <input type="text" required placeholder="Tusaale: Cabdi Cali Maxamed" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Nambarka Telefoonka</label>
                            <input type="tel" required placeholder="61XXXXXXX" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Da'da (Years)</label>
                            <input type="number" min="0" placeholder="25" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Jinsiga</label>
                            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="male">Labi (Male)</option>
                                <option value="female">Dheddig (Female)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Clinical Details & Vital Signs -->
                <div>
                    <h3 class="text-md font-semibold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-heart-pulse text-red-500"></i> Xaaladda Caafimaad (Vitals)
                    </h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] font-medium text-gray-600 mb-1">Dhiigkar (BP)</label>
                            <input type="text" placeholder="120/80" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-gray-600 mb-1">Kuleylka (°C)</label>
                            <input type="text" placeholder="37.0" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-gray-600 mb-1">Miisaanka (Kg)</label>
                            <input type="text" placeholder="70 kg" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Section 3: Doctor & Department Selection -->
                <div>
                    <h3 class="text-md font-semibold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-doctor text-green-600"></i> Waaxda & Dhaqtarka
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Waaxda (Department)</label>
                            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option>General OPD</option>
                                <option>Pediatrics (Caruurta)</option>
                                <option>Cardiology (Wadnaha)</option>
                                <option>Dental (Ilkaha)</option>
                                <option>Emergency (Xaalad degdeg ah)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Dhaqtarka Khasak ah</label>
                            <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option>Dr. Axmed (Generalist)</option>
                                <option>Dr. Caasho (Pediatrician)</option>
                                <option>Dr. Farxaan (Cardiologist)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section 4: Notes -->
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Cabashada Bukaanka / Notes</label>
                    <textarea rows="2" placeholder="Sida calaamadaha, xanuunka uu ka cabanayo..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Keydi Xogta & Diwaan-geli Bukaanka
                    </button>
                </div>

            </div>
        </form>
    </div>

    <!-- JAVASCRIPT FOR CAMERA AND FORM LOGIC -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const placeholderText = document.getElementById('placeholderText');
        const patientForm = document.getElementById('patientForm');

        let currentStream = null;
        let facingMode = "user"; // "user" = Front Camera, "environment" = Back Camera

        // Start Camera Function
        async function startCamera(mode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: mode,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                // Mirror video if Front Camera
                if (mode === 'user') {
                    video.classList.add('transform', '-scale-x-100');
                } else {
                    video.classList.remove('transform', '-scale-x-100');
                }
            } catch (err) {
                console.error("Camera access error: ", err);
                alert("Kamarada lama furi karin. Fadlan hubi fasax ku siinta browser-ka.");
            }
        }

        // Initialize front camera on load
        startCamera(facingMode);

        // Switch Camera (Front / Back)
        switchCamBtn.addEventListener('click', () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            startCamera(facingMode);
        });

        // Capture Snapshot
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = 320;
            canvas.height = 240;

            // Draw image on canvas
            if (facingMode === 'user') {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Display Canvas
            canvas.classList.remove('hidden');
            placeholderText.classList.add('hidden');
        });

        // Submit Form
        patientForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Convert captured image to Data URL if needed
            let imageData = canvas.classList.contains('hidden') ? null : canvas.toDataURL('image/png');
            
            alert("Xogta iyo Sawirka bukaanka si guul leh ayaa loo kaydiyay!");
            console.log("Captured Image Data:", imageData);
        });
    </script>
</body>
</html>
